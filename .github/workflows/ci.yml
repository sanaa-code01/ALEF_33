# ─────────────────────────────────────────────────────────────
# ALEF 33 - Continuous Integration
# On every push and pull request:
#   1. backend: compile + run all tests against a real MySQL
#   2. docker:  build the backend image and check docker-compose.yml
# ─────────────────────────────────────────────────────────────
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:

  backend:
    name: Build & test backend
    runs-on: ubuntu-latest

    # A throwaway MySQL for the test that starts the whole application
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: alef33
          MYSQL_USER: alef33
          MYSQL_PASSWORD: alef33
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -u root -proot --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Compile and run the tests
        run: mvn -B -ntp verify
        env:
          SPRING_DATASOURCE_URL: jdbc:mysql://localhost:3306/alef33?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Africa/Casablanca
          SPRING_DATASOURCE_USERNAME: alef33
          SPRING_DATASOURCE_PASSWORD: alef33
          JWT_SECRET: ci-only-secret-not-used-anywhere-else-0123456789

      - name: Keep the test reports if something failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: backend/target/surefire-reports/

  docker:
    name: Build Docker image
    runs-on: ubuntu-latest
    needs: backend          # only if the tests passed

    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build the backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: false
          tags: alef33-backend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Check docker-compose.yml is valid
        run: docker compose --env-file .env.example config --quiet
