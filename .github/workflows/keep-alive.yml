# ─────────────────────────────────────────────────────────────
# Keeps the online demo awake: visits it once a day, so the free
# Hugging Face Space never goes to sleep before a recruiter opens it.
# ─────────────────────────────────────────────────────────────
name: Keep demo awake

on:
  schedule:
    - cron: "0 7 * * *"     # every day at 07:00 UTC (08:00 in Morocco)
  workflow_dispatch:         # also lets you run it by hand from the Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Visit the demo
        run: |
          curl --silent --show-error --fail \
               --retry 10 --retry-delay 30 --retry-all-errors --max-time 60 \
               https://sanaa116-alef33.hf.space/api/ping
