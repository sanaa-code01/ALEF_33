# ─────────────────────────────────────────────────────────────
# Online demo: builds the Angular app in demo mode and publishes it
# on GitHub Pages at https://sanaa-code01.github.io/ALEF_33/
# Runs on every push that changes the frontend.
# ─────────────────────────────────────────────────────────────
name: Deploy demo (GitHub Pages)

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build Angular demo
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build for GitHub Pages
        run: npx ng build --configuration production --base-href /ALEF_33/

      # A refresh on /ALEF_33/devis/2 must still load the Angular app
      - name: Single-page app fallback
        run: cp dist/frontend/browser/index.html dist/frontend/browser/404.html

      - name: Upload the site
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist/frontend/browser

  deploy:
    name: Publish on GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
