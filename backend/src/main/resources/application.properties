spring.application.name=alef33

# Database (environment variables later for Docker / deployment)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/alef33?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Africa/Casablanca}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:alef33}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:alef33}

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

server.port=${PORT:8080}

# Demo data at startup (only when the database is empty)
app.demo-data=${APP_DEMO_DATA:true}

# Swagger
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.persist-authorization=true

# Security - JWT (the secret will come from an environment variable in production)
app.jwt.secret=${JWT_SECRET:dev-only-secret-change-me-in-production-0123456789}
app.jwt.expiration-hours=8

# First admin account, created at startup if it doesn't exist
app.admin.email=${ADMIN_EMAIL:admin@alef33.ma}
app.admin.password=${ADMIN_PASSWORD:Admin@2026}

# Frontend allowed to call the API (Angular dev server)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}

# Company printed on quotes and invoices (from ALEF 33's own documents)
app.company.name=ALEF 33
app.company.legal-form=SARL
app.company.activity=Equipement professionnel : caf\u00e9, restaurant et snack
app.company.head-office=IMM N\u00b0 02, 2\u00e8me \u00e9tage N\u00b0 66, Bloc A Cit\u00e9 AL WAFA \u2013 Agadir Maroc
app.company.phone=+212 11 33 42 93
app.company.email=ALEF33.SOUSS@GMAIL.COM
app.company.rc=58 313
app.company.patente=48108937
app.company.if=60254748
